name: Test on Push and Pull Request

on:
  push:
    branches:
      - main
      - "release/**"

    paths:
      - "src/**"
      - ".github/workflows/pushpr.yml"

  pull_request:
    branches:
      - main
      - "release/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4.2.2

      - name: run tests
        run: npm test
